services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - tropa_fase2_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (API Reflex)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tropa-fase2-backend
    ports:
      - "127.0.0.1:8100:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - .:/app
      - ./assets/uploads:/app/assets/uploads
      - ./data:/app/data

  # Frontend Service (Static Files via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - API_URL=https://tropa-fase2.academiametodos.com
    container_name: tropa-fase2-frontend
    ports:
      - "127.0.0.1:3100:80"
    volumes:
      - ./assets/uploads:/usr/share/nginx/html/uploads
    depends_on:
      - backend

volumes:
  tropa_fase2_pgdata:
  uploads_data:
